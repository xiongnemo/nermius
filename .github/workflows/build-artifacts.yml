name: Build Artifacts

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARY_NAME: nermius
  CGO_ENABLED: "0"
  GOPROXY: https://goproxy.cn,direct

jobs:
  targets:
    name: Prepare Target Matrix
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.generate.outputs.build_matrix }}
      package_matrix: ${{ steps.generate.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - id: generate
        name: Generate target matrices
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          binary_name = os.environ["BINARY_NAME"]
          # Keep this list opt-in only. The repository does not cross-build on
          # every GOOS/GOARCH pair exposed by `go tool dist list`, and new Go
          # releases may add extra targets such as freebsd/riscv64 that would
          # otherwise start failing the workflow automatically.
          allowed_targets = [
              {"goos": "darwin", "goarch": "amd64"},
              {"goos": "darwin", "goarch": "arm64"},
              {"goos": "linux", "goarch": "386"},
              {"goos": "linux", "goarch": "amd64"},
              {"goos": "linux", "goarch": "arm", "goarm": "6", "arch": "armv6"},
              {"goos": "linux", "goarch": "arm", "goarm": "7", "arch": "armv7"},
              {"goos": "linux", "goarch": "arm64"},
              {"goos": "linux", "goarch": "loong64"},
              {"goos": "linux", "goarch": "riscv64"},
              {"goos": "openbsd", "goarch": "amd64"},
              {"goos": "openbsd", "goarch": "arm64"},
              {"goos": "windows", "goarch": "386"},
              {"goos": "windows", "goarch": "amd64"},
              {"goos": "windows", "goarch": "arm64"},
          ]

          build_targets = []
          available_targets = set(subprocess.check_output(["go", "tool", "dist", "list"], text=True).splitlines())
          for target in allowed_targets:
              goos = target["goos"]
              goarch = target["goarch"]
              if f"{goos}/{goarch}" not in available_targets:
                  continue
              arch = target.get("arch", goarch)
              goarm = target.get("goarm", "")
              target_name = f"{goos}/{arch}"
              ext = ".exe" if goos == "windows" else ""
              artifact = f"{binary_name}-{goos}-{arch}"
              archive = f"{artifact}.tar.gz"
              build_targets.append({
                  "target": target_name,
                  "goos": goos,
                  "goarch": goarch,
                  "goarm": goarm,
                  "arch": arch,
                  "ext": ext,
                  "artifact": artifact,
                  "archive": archive,
              })

          # Alpine and OpenWrt are musl systems, and a plain linux build cannot
          # start on them: go-nativeclipboard reaches libc through purego, whose
          # fakecgo links glibc dynamically even with cgo off. These targets are
          # built with real cgo against musl, cross-compiled by zig, and the apk
          # and ipk packages are made from them.
          musl_zig_targets = {
              "386": "x86-linux-musl",
              "amd64": "x86_64-linux-musl",
              "armv6": "arm-linux-musleabihf",
              "armv7": "arm-linux-musleabihf",
              "arm64": "aarch64-linux-musl",
              "loong64": "loongarch64-linux-musl",
              "riscv64": "riscv64-linux-musl",
          }
          for target in [t for t in build_targets if t["goos"] == "linux" and t["arch"] in musl_zig_targets]:
              artifact = f"{binary_name}-linux-musl-{target['arch']}"
              build_targets.append({
                  **target,
                  "target": f"linux-musl/{target['arch']}",
                  "libc": "musl",
                  "zig_target": musl_zig_targets[target["arch"]],
                  "artifact": artifact,
                  "archive": f"{artifact}.tar.gz",
              })

          linux_arches = [target["arch"] for target in build_targets if target["goos"] == "linux" and target.get("libc") != "musl"]
          linux_arch_set = set(linux_arches)
          package_arches = {
              "deb": {"386", "amd64", "armv7", "arm64", "riscv64"},
              "ipk": {"386", "amd64", "armv7", "arm64", "riscv64"},
              "rpm": linux_arch_set,
              "apk": linux_arch_set,
              "archlinux": linux_arch_set - {"loong64"},
          }
          package_extensions = {
              "deb": "deb",
              "ipk": "ipk",
              "rpm": "rpm",
              "apk": "apk",
              "archlinux": "pkg.tar.zst",
          }
          nfpm_arches = {
              "armv6": "arm6",
              "armv7": "arm7",
          }

          package_targets = []
          for packager in ["deb", "rpm", "apk", "archlinux", "ipk"]:
              for arch in linux_arches:
                  if arch not in package_arches[packager]:
                      continue
                  extension = package_extensions[packager]
                  libc = "musl-" if packager in ("apk", "ipk") else ""
                  package_targets.append({
                      "packager": packager,
                      "arch": arch,
                      "nfpm_arch": nfpm_arches.get(arch, arch),
                      "extension": extension,
                      "source_artifact": f"{binary_name}-linux-{libc}{arch}",
                      "asset": f"{binary_name}-linux-{arch}.{extension}",
                  })

          print(f"build_matrix={json.dumps({'include': build_targets}, separators=(',', ':'))}")
          print(f"package_matrix={json.dumps({'include': package_targets}, separators=(',', ':'))}")
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up zig
        if: matrix.libc == 'musl'
        uses: mlugg/setup-zig@v2
        with:
          # 0.15 is the first release whose `zig cc` honours -dynamic for a
          # cross-compiled musl target (ziglang/zig#23572); 0.14 links statically
          # regardless.
          version: 0.15.2

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          EXT: ${{ matrix.ext }}
          ARTIFACT: ${{ matrix.artifact }}
          ARCHIVE: ${{ matrix.archive }}
          LIBC: ${{ matrix.libc }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          mkdir -p dist
          output="${ARTIFACT}${EXT}"
          eval "$(bash scripts/compute-version.sh)"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" = "HEAD" ]; then
            branch="detached"
          fi
          commit="$(git rev-parse --short=12 HEAD)"
          dirty="false"
          if ! git diff --quiet --ignore-submodules HEAD --; then
            dirty="true"
          fi
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags=(
            "-s"
            "-w"
            "-X"
            "github.com/nermius/nermius/internal/buildinfo.baseVersion=${base_version}"
            "-X"
            "github.com/nermius/nermius/internal/buildinfo.gitBranch=${branch}"
            "-X"
            "github.com/nermius/nermius/internal/buildinfo.gitCommit=${commit}"
            "-X"
            "github.com/nermius/nermius/internal/buildinfo.gitDirty=${dirty}"
            "-X"
            "github.com/nermius/nermius/internal/buildinfo.buildTime=${build_time}"
          )
          if [ "${LIBC}" = "musl" ]; then
            # Go's internal linker would stamp glibc's interpreter onto the binary,
            # so zig links it. zig links musl statically unless told otherwise, and
            # a static binary cannot dlopen the X11 libraries the clipboard needs.
            export CGO_ENABLED=1 CC="zig cc -target ${ZIG_TARGET}" CXX="zig c++ -target ${ZIG_TARGET}"
            ldflags+=("-linkmode" "external" "-extldflags" "-dynamic")
          fi
          echo "Building ${base_version}-${branch}-${commit}"
          go build -trimpath -ldflags="${ldflags[*]}" -o "dist/${output}" .
          if [ "${LIBC}" = "musl" ]; then
            readelf -l "dist/${output}" > elf-headers.txt
            grep -i interpreter elf-headers.txt || { echo "no ELF interpreter: the binary is static"; exit 1; }
            grep -q 'interpreter: /lib/ld-musl-' elf-headers.txt
            readelf -d "dist/${output}" | grep NEEDED
          fi
          sha256sum "dist/${output}" > "dist/${output}.sha256"
          tar -C dist -czf "dist/${ARCHIVE}" "${output}" "${output}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.packager }} ${{ matrix.arch }}
    needs:
      - targets
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.targets.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nFPM
        shell: bash
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_artifact }}
          path: dist/artifacts

      - name: Build package
        shell: bash
        env:
          PACKAGER: ${{ matrix.packager }}
          SOURCE_ARTIFACT: ${{ matrix.source_artifact }}
          ASSET: ${{ matrix.asset }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
        run: |
          mkdir -p dist/package-input dist/packages
          tar -xzf "dist/artifacts/${SOURCE_ARTIFACT}.tar.gz" -C dist/package-input
          binary_path="dist/package-input/${SOURCE_ARTIFACT}"
          chmod 0755 "${binary_path}"
          eval "$(bash scripts/compute-version.sh)"
          export NFPM_VERSION="${base_version#v}"
          export NFPM_ARCH
          export NFPM_BINARY="${PWD}/${binary_path}"
          nfpm package --config nfpm.yaml --packager "${PACKAGER}" --target "dist/packages/${ASSET}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.packager }}-${{ matrix.arch }}
          path: dist/packages/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  # Installs packages the way a user would and runs them. The apk and ipk
  # checks are the point: those systems are musl, and the published apk once
  # shipped a glibc binary that installed cleanly and then could not start.
  # Foreign architectures run under QEMU; the binary only has to start.
  package-smoke:
    name: Smoke ${{ matrix.format }} on ${{ matrix.image }} (${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: apk, image: "alpine:3.21", arch: amd64, platform: linux/amd64 }
          - { format: apk, image: "alpine:3.24", arch: amd64, platform: linux/amd64 }
          - { format: apk, image: "alpine:3.24", arch: arm64, platform: linux/arm64 }
          - { format: apk, image: "alpine:3.24", arch: "386", platform: linux/386 }
          - { format: apk, image: "alpine:3.24", arch: armv6, platform: linux/arm/v6 }
          - { format: apk, image: "alpine:3.24", arch: armv7, platform: linux/arm/v7 }
          - { format: apk, image: "alpine:3.24", arch: riscv64, platform: linux/riscv64 }
          - { format: apk, image: "alpine:3.24", arch: loong64, platform: linux/loong64 }
          - { format: ipk, image: "openwrt/rootfs:x86-64-v24.10.8", arch: amd64, platform: linux/amd64 }
          - { format: deb, image: "debian:stable", arch: amd64, platform: linux/amd64 }
          - { format: rpm, image: "fedora:latest", arch: amd64, platform: linux/amd64 }
    steps:
      - name: Set up QEMU
        if: matrix.arch != 'amd64' && matrix.arch != 'arm64'
        uses: docker/setup-qemu-action@v3

      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.format }}-${{ matrix.arch }}
          path: pkg

      - name: Install and run
        shell: bash
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          ls -l pkg
          docker run --rm --platform "${{ matrix.platform }}" -e FORMAT -v "$PWD/pkg:/pkg:ro" "${{ matrix.image }}" sh -euc '
            case "$FORMAT" in
              apk) apk add --no-cache --allow-untrusted /pkg/*.apk ;;
              ipk) mkdir -p /var/lock && opkg install /pkg/*.ipk ;;
              deb) apt-get update -qq && apt-get install -y -qq /pkg/*.deb ;;
              rpm) dnf install -y -q /pkg/*.rpm ;;
            esac
            nermius version
          '

  prerelease:
    name: Publish Dev Prerelease
    needs:
      - build
      - package
      - package-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - id: meta
        name: Compute prerelease metadata
        shell: bash
        run: |
          eval "$(bash scripts/compute-version.sh)"
          short_sha="${GITHUB_SHA::12}"
          tag="${base_version}-dev-${short_sha}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=Dev prerelease ${tag}" >> "$GITHUB_OUTPUT"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.ipk
            dist/*.pkg.tar.zst
          body: |
            Automated prerelease build from `dev`.
            
            Version: `${{ steps.meta.outputs.base_version }}`
            Commit: `${{ github.sha }}`

      # The package repository fetches this release by tag and hashes the assets
      # itself, so all this sends is which release to look at. Without the token
      # the release still ships and the repository's own sweep picks it up later.
      - name: Tell the package repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          PACKAGES_REPO: ${{ vars.PACKAGES_REPO || 'xiongnemo/packages' }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PACKAGES_DISPATCH_TOKEN is not set; ${PACKAGES_REPO} will pick this up on its own schedule."
            exit 0
          fi
          gh api "repos/${PACKAGES_REPO}/dispatches" \
            -f event_type=release-published \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[channel]=nightly" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            || echo "::warning title=Package repository not notified::dispatch to ${PACKAGES_REPO} failed; its scheduled sweep is the backstop."
